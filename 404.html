<!doctype html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">

<style>
  :root { color-scheme: light; }
  body {
    margin: 0; background: #fbfbfa; color: #1a1a19;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 72px 20px; }
  h1 { margin: 0 0 12px; font-size: clamp(24px, 5vw, 34px); line-height: 1.25; }
  p { margin: 0 0 24px; color: #5b5b58; }
  a.btn {
    display: inline-block; padding: 12px 20px; border-radius: 10px;
    background: #16624a; color: #fff; text-decoration: none; font-size: 15px;
  }
  a.btn:focus-visible { outline: 3px solid #0b6b4f; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>这个页面不存在</h1>
  <p>可能是链接写错了。压缩图片只需要一个页面。</p>
  <p><a class="btn" href="https://freddywang12138.github.io/tuxiaoyu/">回到压缩图片</a></p>
</main>
</body>
</html>
